name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build — ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: merges
            artifact: merges-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: merges
            artifact: merges-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: merges
            artifact: merges-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: merges
            artifact: merges-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross-compiler (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create checksums
        working-directory: artifacts
        run: |
          for dir in */; do
            f="${dir%/}"
            sha256sum "$f/$f" > "$f/$f.sha256"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/merges-linux-x86_64/merges-linux-x86_64
            artifacts/merges-linux-x86_64/merges-linux-x86_64.sha256
            artifacts/merges-linux-aarch64/merges-linux-aarch64
            artifacts/merges-linux-aarch64/merges-linux-aarch64.sha256
            artifacts/merges-macos-aarch64/merges-macos-aarch64
            artifacts/merges-macos-aarch64/merges-macos-aarch64.sha256
            artifacts/merges-macos-x86_64/merges-macos-x86_64
            artifacts/merges-macos-x86_64/merges-macos-x86_64.sha256
